<!DOCTYPE html>
<html>
<head>
    <!-- Set the page text encoding and the title shown in the browser tab. -->
    <meta charset="UTF-8">
    <title>Calculator</title>
</head>
<body>
    <h1>Calculator</h1>

    <!-- POST sends the form values to Flask, which calculates and returns the result. -->
    <form method="POST">
        <!-- Each input's name is the key Flask reads from the submitted form. -->
        <label for="number1">First number:</label>
        <input type="number" step="1" id="number1" name="number1">

        <br><br>

        <label for="number2">Second number:</label>
        <input type="number" step="1" id="number2" name="number2">

        <br><br>

        <!-- The selected option tells Flask which arithmetic operation to perform. -->
        <label for="operation">Operation:</label>
        <select id="operation" name="operation">
            <option value="add">Add</option>
            <option value="subtract">Subtract</option>
            <option value="multiply">Multiply</option>
            <option value="divide">Divide</option>
        </select>

        <br><br>

        <button type="submit">Calculate</button>
    </form>

    <!-- Flask/Jinja replaces result with the answer or an input error message. -->
    <p>Result: {{ result }}</p>
</body>
</html>
